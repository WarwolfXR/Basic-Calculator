<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script src = "script.js" defer></script>
</head>


<body>

    <header class = "navbar">
        <h1>Calculator</h1>
    </header>

    <div class = "calculator">

        <input type = "text" id = "display" disabled>
        <div class = "buttons">
            <button class = "btn" data-action = "clear">C</button>
            <button class = "btn" data-action = "delete">←</button>
            <button class = "btn operator" data-value="/">÷</button>
            <button class="btn operator" data-value="*">×</button>

            <button class = "btn" data-value="7">7</button>
            <button class = "btn" data-value="8">8</button>
            <button class = "btn" data-value="9">9</button>
            <button class="btn operator" data-value="-">−</button>

            <button class = "btn" data-value="4">4</button>
            <button class = "btn" data-value="5">5</button>
            <button class = "btn" data-value="6">6</button>
            <button class="btn operator" data-value="+">+</button>

            <button class = "btn" data-value="1">1</button>
            <button class = "btn" data-value="2">2</button>
            <button class = "btn" data-value="3">3</button>
            <button class = "btn equal" data-action="calculate">=</button>

            <button class = "btn zero" data-value="0">0</button>
            <button class = "btn" data-value=".">.</button>


        </div>
    </div>
    <footer class = "footer">
        <a href = "https://www.github.com/WarwolfXR" target="_blank">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" 
         alt="GitHub Logo" class="github-logo">
         <span>My GitHub</span>
        </a>
    </footer>
</body>
</html>
